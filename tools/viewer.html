<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Viewer</title>
<style>
  :root { --bg: #20242b; --fg: #d8dde5; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  #info { position: absolute; top: 8px; left: 12px; pointer-events: none; }
  #controls { position: absolute; top: 30px; left: 12px; display: flex; flex-direction: column; align-items: start; gap: 5px; }
  #controls > * { display: none; max-width: calc(100vw - 24px); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info"></div>
<div id="controls">
<select id="units" aria-label="Unit"></select>
<select id="states" aria-label="Animation state"></select>
<select id="clips" aria-label="Animation choice or clip"></select>
<select id="level" aria-label="Gear level"></select>
<label id="blood"><input type="checkbox"> Blood overlays</label>
<select id="team" aria-label="Team colour"></select>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { restoreAppearance } from './model-appearance.mjs';

const params = new URLSearchParams(location.search);
// ?index= points at the index.json written by "lms2gltf.py units"; ?model= overrides the unit.
const indexUrl = params.get('index') || '../converted/units/index.json';
const indexDir = indexUrl.slice(0, indexUrl.lastIndexOf('/') + 1);
const url = params.get('model') || indexDir + 'MODEL_G_ARAGORN.glb';
const info = document.getElementById('info');

fetch(indexUrl).then(r => r.ok ? r.json() : []).then(entries => {
  const select = document.getElementById('units');
  for (const e of entries.filter(e => e.file)) {
    select.add(new Option(`${e.unit}  (${e.clips.length} clips)`, indexDir + e.file));
  }
  if (!select.options.length) return;
  if (![...select.options].some(o => o.value === url)) select.add(new Option(url.split('/').pop(), url));
  select.value = url;
  select.onchange = () => {
    const next = new URLSearchParams({ index: indexUrl, model: select.value });
    location.search = next.toString();
  };
  select.style.display = 'block';
}).catch(() => {});

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(2, 4, 3);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
const clock = new THREE.Clock();
let mixer = null, appearance = null, activeChoice = null, activeAction = null, previewConfig = null;
// ?state=ID|NAME, ?choice=N or ?clip=Name; ?t=0.5 freezes a normalized clip time.
const requestedTime = Number(params.get('t'));
const freeze = params.has('t') && Number.isFinite(requestedTime) ? Math.min(1, Math.max(0, requestedTime)) : null;

function applyAppearance() {
  const time = freeze ?? (activeAction && activeAction.getClip().duration > 0 ?
    activeAction.time / activeAction.getClip().duration : 0);
  appearance?.apply(activeChoice, time, previewConfig);
}

function setupClips(root, clips) {
  mixer = new THREE.AnimationMixer(root);
  const select = document.getElementById('clips'), states = document.getElementById('states');
  const model = appearance?.data.models[0];
  const namedStates = model?.states ?? [];
  for (const s of namedStates) states.add(new Option(s.name || `State ${s.id}`, String(s.id)));
  states.add(new Option('Skeleton clips (default appearance)', 'raw'));
  const selectedState = () => namedStates.find(s => String(s.id) === states.value);
  const play = () => {
    mixer.stopAllAction();
    activeAction = null;
    const state = selectedState();
    activeChoice = state?.choices[Number(select.value)] ?? null;
    const clip = clips.find(c => c.name === (state ? activeChoice?.clip : select.value));
    if (clip) {
      activeAction = mixer.clipAction(clip).play();
      if (freeze !== null) { activeAction.paused = true; activeAction.time = freeze * clip.duration; }
    }
    mixer.update(0);
    applyAppearance();
  };
  const fill = (wantedClip = null, wantedChoice = null) => {
    select.replaceChildren();
    const state = selectedState();
    if (state) {
      state.choices.forEach((c, i) => select.add(new Option(
        `${c.clip || 'Static'} (weight ${c.weight}/${state.totalWeight})`, String(i))));
      const index = wantedChoice ?? state.choices.findIndex(c => wantedClip ? c.clip === wantedClip : c.weight > 0);
      select.value = String(index >= 0 && index < state.choices.length ? index : 0);
    } else {
      for (const c of clips) select.add(new Option(`${c.name} (${c.duration.toFixed(2)}s)`, c.name));
      select.value = clips.some(c => c.name === wantedClip) ? wantedClip : clips[0]?.name;
    }
    select.style.display = select.options.length ? 'block' : 'none';
    play();
  };
  const wanted = params.get('state'), wantedClip = params.get('clip');
  let initial = namedStates.find(s => s.name === wanted || String(s.id) === wanted) ??
    namedStates.find(s => s.id === model?.defaultState);
  if (!wanted && wantedClip && !initial?.choices.some(c => c.clip === wantedClip)) {
    initial = namedStates.find(s => s.choices.some(c => c.clip === wantedClip));
  }
  states.value = initial ? String(initial.id) : 'raw';
  states.style.display = namedStates.length ? 'block' : 'none';
  states.onchange = () => fill();
  select.onchange = play;
  const choice = params.has('choice') ? Number(params.get('choice')) : null;
  fill(wantedClip, Number.isInteger(choice) ? choice : null);
}

function setupConfiguration() {
  if (!appearance) return;
  previewConfig = {...appearance.data.config};
  const level = document.getElementById('level'), blood = document.querySelector('#blood input');
  for (let i = 1; i <= 4; i++) level.add(new Option(`Gear level ${i}`, i));
  const wantedLevel = Number(params.get('level'));
  if (Number.isInteger(wantedLevel) && wantedLevel >= 1 && wantedLevel <= 4) previewConfig.level = wantedLevel;
  if (params.has('blood')) previewConfig.blood = params.get('blood') === '1';
  level.value = String(previewConfig.level);
  blood.checked = previewConfig.blood;
  level.onchange = () => { previewConfig.level = Number(level.value); applyAppearance(); };
  blood.onchange = () => { previewConfig.blood = blood.checked; applyAppearance(); };
  level.style.display = 'block';
  document.getElementById('blood').style.display = 'block';
}

// TeamColors.lqr. Team colour parts carry their mask as emissiveMap; the colour is the emissive.
const TEAM_COLORS = { Red: [185, 0, 0], Green: [83, 179, 0], Blue: [2, 92, 209], Purple: [129, 0, 194],
  Yellow: [204, 184, 0], Cyan: [0, 152, 163], Orange: [255, 132, 0], Gray: [255, 255, 255], Pink: [255, 166, 255] };

// ?team=Blue picks the colour.
function setupTeam(root) {
  const materials = new Set();
  root.traverse(o => { if (o.isMesh && o.material.emissiveMap) materials.add(o.material); });
  if (!materials.size) return;
  const select = document.getElementById('team');
  for (const name in TEAM_COLORS) select.add(new Option(`Team: ${name}`, name));
  const apply = name => {
    const [r, g, b] = TEAM_COLORS[name];
    for (const m of materials) m.emissive.setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
  };
  const wanted = params.get('team');
  select.value = Object.hasOwn(TEAM_COLORS, wanted) ? wanted : 'Red';
  select.onchange = () => apply(select.value);
  select.style.display = 'block';
  apply(select.value);
}

new GLTFLoader().load(url, async gltf => {
  try {
    const root = gltf.scene;
    appearance = await restoreAppearance(gltf);
    scene.add(root);
    root.traverse(o => { if (o.isSkinnedMesh) o.frustumCulled = false; });
    setupConfiguration();
    setupClips(root, gltf.animations);
    setupTeam(root);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    root.traverseVisible(o => { if (o.isMesh) box.expandByObject(o); });
    if (box.isEmpty()) box.setFromCenterAndSize(new THREE.Vector3(), new THREE.Vector3(1, 1, 1));
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const focus = params.get('focus')?.split(',').map(Number);
    if (focus?.length === 3 && focus.every(Number.isFinite)) center.fromArray(focus);
    const world = gltf.parser.json.extras?.wotrWorld;
    const extent = Math.max(4, Math.ceil(Math.max(size.x, size.z) * 1.5));
    if (!world) scene.add(new THREE.GridHelper(extent, extent * 4, 0x556070, 0x3a404a));
    let tris = 0;
    root.traverse(o => { if (o.isMesh) tris += o.geometry.index.count / 3; });
    const yaw = parseFloat(params.get('yaw') || '0') * Math.PI / 180;
    const requestedDistance = Number(params.get('distance'));
    const dist = requestedDistance > 0 && Number.isFinite(requestedDistance) ? requestedDistance : Math.max(size.x, size.y, size.z) * 1.8;
    const pitch = parseFloat(params.get('pitch') || (world ? '50' : '0')) * Math.PI / 180;
    camera.near = Math.max(0.01, dist / 10000);
    camera.far = Math.max(100, dist * 5);
    camera.updateProjectionMatrix();
    camera.position.set(center.x + Math.sin(yaw) * Math.cos(pitch) * dist,
      center.y + Math.sin(pitch) * dist + size.y * 0.15,
      center.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    controls.target.copy(center);
    controls.update();
    const clothCount = appearance?.data.models.reduce((n, m) => n + (m.cloths?.length ?? 0), 0) ?? 0;
    info.textContent = `${url.split('/').pop()}  |  ${tris} total triangles  |  ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m` +
      (clothCount ? `  |  ${clothCount} cloth surfaces (initial pose)` : '') +
      (world ? `  |  ${world.placed_objects} placed objects, ${world.water.length} lakes, ${world.decals?.length ?? 0} decals` : '');
  } catch (err) { info.textContent = 'Failed to prepare ' + url + ': ' + err.message; }
}, undefined, err => { info.textContent = 'Failed to load ' + url + ': ' + err.message; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && freeze === null) mixer.update(dt);
  applyAppearance();
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
